name: delta-brief
on:
  schedule:
    - cron: "30 5 * * 1-5"   # 05:30 UTC, vardagar
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas
      - run: python delta.py
      - run: |
          git config user.name "delta-bot"
          git config user.email "delta-bot@users.noreply.github.com"
          git add docs
          git commit -m "brief" || exit 0
          git push
